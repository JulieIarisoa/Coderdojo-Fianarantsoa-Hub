name: 🐛 Rapport de Bug
description: Signaler un dysfonctionnement ou une erreur dans l'application.
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce formulaire avec précision pour nous aider à reproduire et corriger le problème rapidement.

  - type: textarea
    id: description
    attributes:
      label: 📝 Description du problème
      description: Résumé clair du problème rencontré.
      placeholder: Lors du clic sur le bouton "Soumettre", l'application affiche une page blanche...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 🔄 Étapes pour reproduire
      description: Indiquez pas à pas comment reproduire ce bug.
      placeholder: |
        1. Aller sur la page '/secret-friend'
        2. Cliquer sur 'Rejoindre le groupe'
        3. Observer l'erreur dans la console du navigateur
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 🎯 Comportement attendu
      description: Ce qui aurait dû se passer.
      placeholder: L'utilisateur aurait dû recevoir une confirmation et accéder au formulaire.
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: 🖥️ Logs Console / Captures d'écran
      description: Collez ici les messages d'erreur de la console ou glissez des captures d'écran.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 🌐 Environnement
      description: Navigateur, OS, type d'appareil.
      placeholder: Chrome v122 / Ubuntu Linux 22.04 / Desktop
    validations:
      required: false
